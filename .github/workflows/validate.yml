name: Validate Vehicle Analyzer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check app.js
          node --check api/analyze.js
          node --check api/health.js
      - name: Run backend smoke tests
        run: npm test
      - name: Verify accident description field is removed
        run: |
          ! grep -q 'id="description"' index.html
          ! grep -q 'Accident Description (Optional)' index.html
      - name: Verify API key is not in frontend
        run: |
          ! grep -Eq 'sk-[A-Za-z0-9]{20,}' app.js index.html
