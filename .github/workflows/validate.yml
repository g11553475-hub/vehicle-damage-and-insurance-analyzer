name: Validate Vehicle Analyzer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check app.js
      - name: Verify description form is removed
        run: |
          ! grep -q 'id="description"' index.html
          ! grep -q 'Accident Description (Optional)' index.html
